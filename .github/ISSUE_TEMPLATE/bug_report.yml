name: 🐛 Bug report
description: Report something that's broken or behaving unexpectedly
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
        If this is a **security vulnerability**, do NOT use this template —
        follow [SECURITY.md](https://github.com/renxqoo/auth-proxy/blob/main/SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is.
      placeholder: "When I do X, Y happens instead of Z..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, self-contained steps to reproduce the behavior.
      placeholder: |
        1. Start the server with config '...'
        2. Call endpoint '...'
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened (logs, status codes, error messages).
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: auth-proxy version / commit
      placeholder: "e.g. v0.1.0 or commit SHA"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node / pnpm version
      placeholder: "e.g. Node 22.5.0 / pnpm 11.1.2"

  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - Local dev (pnpm dev:all)
        - Docker compose
        - Production deploy
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant (DB/Redis version, OS, browser, screenshots).
