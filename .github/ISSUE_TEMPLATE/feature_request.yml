name: ✨ Feature request
description: Suggest a new feature or improvement
title: "[feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe the *problem* first,
        then your proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that the project currently doesn't support?
      placeholder: "I want to ... but currently I can't because ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to happen. Include any API/command examples if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've thought about.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, related issues, etc.
