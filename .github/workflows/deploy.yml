name: Deploy

# 手动触发:去 Actions 页面点 "Run workflow"。
# 会 SSH 到服务器拉取最新镜像并重启。
# 需要配 Secrets: DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PORT(可选)
# 必填 input: public_base_url —— 对外公网地址(拼 verification_uri 用)。
#   ⚠️ 不能用 hostname -I 推导:云服务器上它返回内网 IP(如 172.24.x.x),
#   会导致 CLI 收到的登录链接指向内网、公网打不开。
# 可选: DEPLOY_ADMIN_PASSWORD —— 首次部署时用它作为 admin 初始密码(推荐,避免随机密码进日志)。
#      不配则随机生成,写入服务器 .env 并用 ::add-mask:: 打码,明文不打印。
"on":
  workflow_dispatch:
    inputs:
      image_tag:
        description: "镜像 tag(默认 latest;填 git sha 前 7 位可回滚到指定版本)"
        required: false
        default: latest
        type: string
      public_base_url:
        description: "对外公网地址(必填,如 http://1.2.3.4 或 https://auth.example.com)。勿填内网 IP。"
        required: true
        type: string

env:
  REMOTE_DIR: /opt/auth-proxy
  ADMIN_PASSWORD: ${{ secrets.DEPLOY_ADMIN_PASSWORD || '' }}
  # 把 workflow input 映射成环境变量,经 ssh-action 的 envs 传到服务器脚本
  PUBLIC_BASE_URL_INPUT: ${{ inputs.public_base_url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload compose files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "docker-compose.yml,nginx.conf,ops/"
          target: ${{ env.REMOTE_DIR }}
          overwrite: true

      - name: Pull images & deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: REMOTE_DIR, ADMIN_PASSWORD, PUBLIC_BASE_URL_INPUT
          script: |
            set -euo pipefail
            cd "$REMOTE_DIR"
            chmod +x ops/*.sh 2>/dev/null || true

            # ---------- PUBLIC_BASE_URL:从 workflow input 读,校验非内网 ----------
            # 不再用 hostname -I 推导(云服务器返回内网 IP,导致 verification_uri 指向内网)。
            PUBLIC_BASE_URL="${PUBLIC_BASE_URL_INPUT}"
            if [ -z "$PUBLIC_BASE_URL" ]; then
              echo "❌ public_base_url input 未填"; exit 1
            fi
            case "$PUBLIC_BASE_URL" in
              http://10.*|https://10.*|\
              http://192.168.*|https://192.168.*|\
              http://172.1[6-9].*|https://172.1[6-9].*|\
              http://172.2[0-9].*|https://172.2[0-9].*|\
              http://172.3[01].*|https://172.3[01].*|\
              http://localhost*|https://localhost*|\
              http://127.*|https://127.*|\
              http://169.254.*|https://169.254.*)
                echo "❌ PUBLIC_BASE_URL 疑似内网/本机地址: $PUBLIC_BASE_URL"
                echo "   公网部署必须填公网 IP 或域名。"; exit 1 ;;
            esac

            # ---------- .env 管理(首次生成 + 增量补全,保留已有密钥)----------
            if [ ! -f .env ]; then
              echo "首次部署:生成 .env + 强随机密钥"
              SEC_ADMIN_SESSION=$(openssl rand -hex 32)
              SEC_POSTGRES_PASSWORD=$(openssl rand -hex 16)
              if [ -n "${ADMIN_PASSWORD:-}" ]; then
                SEC_ADMIN_PASSWORD="$ADMIN_PASSWORD"   # 来自 Secret,自动打码,不进日志
              else
                SEC_ADMIN_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=' | cut -c1-20)
                echo "::add-mask::$SEC_ADMIN_PASSWORD" # 即使误打印也显示 ***
              fi
              cat > .env <<EOF
            ADMIN_SESSION_SECRET=$SEC_ADMIN_SESSION
            POSTGRES_USER=auth-proxy
            POSTGRES_PASSWORD=$SEC_POSTGRES_PASSWORD
            POSTGRES_DB=auth-proxy
            ADMIN_USERNAME=admin
            ADMIN_PASSWORD=$SEC_ADMIN_PASSWORD
            PUBLIC_BASE_URL=$PUBLIC_BASE_URL
            EOF
              chmod 600 .env
              echo "✅ .env 已生成"
              echo "⚠️ admin 初始密码已写入服务器 $REMOTE_DIR/.env"
              echo "   查看方式(SSH 到服务器): grep ADMIN_PASSWORD $REMOTE_DIR/.env"
            else
              echo ".env 已存在,保留现有密钥"
            fi
            # 纠正:旧部署可能写入内网 PUBLIC_BASE_URL(hostname -I 时代的残留),
            # 用本次传入的公网值覆盖,确保 CLI 收到的链接指向公网。
            if grep -q '^PUBLIC_BASE_URL=' .env; then
              CUR_PBU=$(grep '^PUBLIC_BASE_URL=' .env | cut -d= -f2-)
              case "$CUR_PBU" in
                http://10.*|https://10.*|\
                http://192.168.*|https://192.168.*|\
                http://172.1[6-9].*|https://172.1[6-9].*|\
                http://172.2[0-9].*|https://172.2[0-9].*|\
                http://172.3[01].*|https://172.3[01].*|\
                http://localhost*|https://localhost*|\
                http://127.*|https://127.*|\
                http://169.254.*|https://169.254.*)
                  echo "⚠️  检测到 .env 里 PUBLIC_BASE_URL 是内网地址($CUR_PBU),纠正为公网值"
                  sed -i "s|^PUBLIC_BASE_URL=.*|PUBLIC_BASE_URL=$PUBLIC_BASE_URL|" .env
                  chmod 600 .env
                  ;;
              esac
            fi
            # 校验必需变量
            for v in ADMIN_SESSION_SECRET POSTGRES_PASSWORD ADMIN_USERNAME ADMIN_PASSWORD PUBLIC_BASE_URL; do
              val=$(grep "^${v}=" .env | cut -d= -f2-)
              [ -z "$val" ] && { echo "❌ .env 缺少: $v"; exit 1; }
            done

            # ---------- 拉镜像 + 启动 ----------
            IMAGE_TAG="${{ inputs.image_tag }}" docker compose pull
            docker compose down
            IMAGE_TAG="${{ inputs.image_tag }}" docker compose up -d

            # ---------- 安装运维 cron(幂等)----------
            mkdir -p /var/log
            touch /var/log/auth-proxy-backup.log /var/log/auth-proxy-health.log 2>/dev/null || true
            cat > /etc/cron.d/auth-proxy <<EOF
            SHELL=/bin/bash
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            0 3 * * * root $REMOTE_DIR/ops/backup.sh >> /var/log/auth-proxy-backup.log 2>&1
            */5 * * * * root $REMOTE_DIR/ops/healthcheck.sh >> /var/log/auth-proxy-health.log 2>&1
            EOF
            chmod 644 /etc/cron.d/auth-proxy
            systemctl reload cron 2>/dev/null || systemctl reload crond 2>/dev/null || true
            echo "✅ cron 已安装"

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            for i in $(seq 1 30); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:80/ || echo 000)
              if [ "$CODE" = "200" ]; then
                echo "✅ 就绪 (HTTP 200, 第 $i 次探测)"
                exit 0
              fi
              echo "等待中... HTTP $CODE ($i/30)"
              sleep 3
            done
            echo "❌ 30 次探测未就绪,最近日志:"
            cd ${{ env.REMOTE_DIR }} && docker compose logs --tail=40 server
            exit 1
