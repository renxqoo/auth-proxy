# docker-compose —— auth-proxy 全栈部署。
#
# 服务编排:
#   nginx(:80 公网)──► server(:3000)──► company-mock(:4000 仅内部)
#                                      server ──► postgres / redis
#
# 部署:见 deploy.sh(一键上传 + 构建 + up)
# 本地验证:docker compose up --build -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auth-proxy}
      # 本地开发占位值(仅本地);生产必须在 .env 提供强随机值
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-prod-use-strong-random}
      POSTGRES_DB: ${POSTGRES_DB:-auth-proxy}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auth-proxy}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 生产加密码(命令行传入);本地可空
    command: >
      sh -c "
      if [ -n \"$${REDIS_PASSWORD}\" ]; then
        redis-server --requirepass \"$${REDIS_PASSWORD}\";
      else
        redis-server;
      fi"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  company-mock:
    image: ghcr.io/${GH_OWNER:-renxqoo}/auth-proxy/company-mock:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }
    environment:
      MOCK_PORT: "4000"
      TOKEN_TTL: "3600"
    # 不映射端口:仅内部网络可见(server 通过服务名访问)

  # 一次性:建表 + 种子(仅 RSA 密钥)。幂等,重复跑无副作用。
  # seed 不创建任何 admin 账号(代码零默认,避免公开仓库里的弱口令被利用)。
  # 首个 admin 由部署者用 create-admin 脚本手动创建,不依赖任何 ADMIN_* env。
  migrate:
    image: ghcr.io/${GH_OWNER:-renxqoo}/auth-proxy/server:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-auth-proxy}:${POSTGRES_PASSWORD:-change-me-prod-use-strong-random}@postgres:5432/${POSTGRES_DB:-auth-proxy}
    command: >
      sh -c "
      node packages/db/dist/migrate.js &&
      node packages/db/dist/seed.js
      "
    restart: "no"

  server:
    image: ghcr.io/${GH_OWNER:-renxqoo}/auth-proxy/server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 日志轮转:避免 json-file 无限增长撑爆磁盘
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "5" }
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      company-mock:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production # 触发 assertProductionConfig 等生产校验
      SERVER_PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-auth-proxy}:${POSTGRES_PASSWORD:-change-me-prod-use-strong-random}@postgres:5432/${POSTGRES_DB:-auth-proxy}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/2}
      COMPANY_API_BASE: http://company-mock:4000
      JWT_ISSUER: ${JWT_ISSUER:-auth-proxy}
      REFRESH_REUSE_GRACE_SEC: "30"
      TLS_ENABLED: "0" # TLS 由 nginx 终止
      # admin 后台 session cookie 签名密钥。
      # 无兜底默认:必须在 .env 里提供强随机值(≥32 字节),
      # 否则 assertProductionConfig 会拒绝启动(防 cookie 伪造)。
      # deploy.sh 首次部署时自动生成并写入 .env。
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET must be set in .env}
      # 对外可访问的 web 基址(拼 verification_uri 用,防 host header 注入钓鱼)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set in .env}
      # 限流(默认宽松,生产可调)
      RL_LOGIN_MAX: ${RL_LOGIN_MAX:-20}
      RL_TOKEN_MAX: ${RL_TOKEN_MAX:-120}
      RL_PROXY_MAX: ${RL_PROXY_MAX:-300}
      RL_ADMIN_LOGIN_MAX: ${RL_ADMIN_LOGIN_MAX:-10}
      RL_DEVICE_AUTH_MAX: ${RL_DEVICE_AUTH_MAX:-30}
    # 不直接映射 80:由 nginx 代理
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  admin-web:
    image: ghcr.io/${GH_OWNER:-renxqoo}/auth-proxy/admin-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "30m", max-file: "3" }
    depends_on:
      - server
    environment:
      SERVER_BASE_URL: http://server:3000 # 内部:next rewrites 代理到 server
    # 不公网暴露:nginx 代理 /admin → admin-web:3001

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "30m", max-file: "5" }
    depends_on:
      - server
      - admin-web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pg_data:
  redis_data:
