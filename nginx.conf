# nginx 反向代理 —— 路由分流(基于最长前缀匹配)
#
# /admin/web/   → server:3000    (后台 API,cookie 鉴权)
# /admin/       → admin-web:3001  (后台页面,Next.js)
# /             → server:3000     (CLI 业务 + 设备流程 + gateway)

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # 公共 header(透传真实客户端信息)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 后台 API(session cookie 鉴权)→ server
    location /admin/web/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        # cookie 需要正确的 host 才能设置
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 后台页面 → admin-web(Next.js,basePath=/admin)。
    # 关键:X-Forwarded-Host 必须设为用户访问的 host,否则 Next.js Server Actions 校验失败。
    location /admin {
        proxy_pass http://admin-web:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 其余(CLI 业务、设备流程、gateway、jwks 等)→ server
    location / {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
